[build]
  # Use the Netlify-provided pnpm when it exists; otherwise (e.g. CLI/local
  # builds where pnpm isn't on PATH) fetch the pinned pnpm via Corepack and
  # install dependencies first.
  command = "if command -v pnpm >/dev/null 2>&1; then pnpm build; else corepack pnpm install --frozen-lockfile && corepack pnpm build; fi"
  publish = "dist"

[build.environment]
  # Node 22.12.0's bundled Corepack has outdated npm signing keys and fails to
  # verify recent pnpm releases ("Cannot find matching keyid"). Node 24 ships a
  # newer Corepack and still satisfies the "engines" requirement (>=22.12).
  NODE_VERSION = "24"
  # Fallback: skip Corepack's signature check if its bundled keys lag behind the
  # npm registry's again. The package tarball's integrity hash is still verified.
  COREPACK_INTEGRITY_KEYS = "0"
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
